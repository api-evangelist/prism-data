aid: prism-data
name: Prism Data
description: >-
  Prism Data is a cash flow underwriting infrastructure and analytics platform
  that helps lenders expand approvals and lower losses by turning raw bank
  transaction data into decisioning signals. Its products include CashScore (a
  cash-flow-based credit score), transaction Categories, Income verification,
  and Insights, delivered through an API and the Pulse dashboard for credit
  underwriting across the United States and Canada. Developer API documentation
  is published at docs.prismdata.com behind a developer login.
